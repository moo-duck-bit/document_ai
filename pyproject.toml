[project]
name = "document-ai"
version = "0.1.0"
description = "Form-fill agent for EC-SW DOCX documents"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
document-ai = "document_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
